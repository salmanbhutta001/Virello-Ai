name: Build Virello APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build APK (release)
        working-directory: apps/mobile
        # Test build: connect to localhost backend (Termux on same phone)
        run: flutter build apk --release --dart-define=VIRELLO_API_URL=http://127.0.0.1:8125

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: virello-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
