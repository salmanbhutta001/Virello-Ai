name: Build Virello APK + AAB

on:
  push:
    branches: [ main ]
    # Gallery image commits (backend/app/static/gallery/**) and backend-only
    # changes must NOT rebuild the APK — product images are served live by the
    # backend at runtime, never bundled in the app. Build only when the mobile
    # app itself (or this workflow) changes.
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

# Cancel superseded runs so gallery/hourly pushes never pile up APK builds.
concurrency:
  group: apk-build-main
  cancel-in-progress: true

# The release-publish step needs write access to create/update the
# 'latest' GitHub Release (repo default token permissions are restricted).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space (runner hygiene)
        # 2026-10-08: build #210 died with "No space left on device" on the
        # runner itself. Each run gets a fresh VM, but heavy Flutter+Gradle
        # builds still benefit from dropping the big pre-installed
        # toolchains we never use (dotnet, ghc, swift). Frees ~5-10 GB.
        run: |
          echo "Disk before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          echo "Disk after:"; df -h / | tail -1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Apply splash and icon fix
        working-directory: apps/mobile
        run: |
          # Splash assets already live in the repo; the legacy zip link may be
          # dead — try it but never fail the build if the download is invalid.
          if curl -L --fail -s -o /tmp/splash.zip "https://muse.ai/files/1389292924257306/1105209719126885/fwaaq1ey9v4n95luv7jr3qpi/virello-splash.zip" && unzip -t -q /tmp/splash.zip >/dev/null 2>&1; then
            unzip -o -q /tmp/splash.zip
          else
            echo "Splash zip unavailable or invalid — using repo assets."
          fi
          rm -f /tmp/splash.zip
          # Allow cleartext HTTP for localhost testing
          sed -i 's/android:icon="@mipmap\/ic_launcher">/android:icon="@mipmap\/ic_launcher"\n        android:usesCleartextTraffic="true">/' android/app/src/main/AndroidManifest.xml

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Setup release keystore
        working-directory: apps/mobile/android
        run: |
          # Diagnose exactly which secrets are visible to the workflow (names only, never values).
          MISSING=""
          [ -n "${{ secrets.VIRELLO_KEYSTORE_BASE64 }}" ] || MISSING="$MISSING VIRELLO_KEYSTORE_BASE64"
          [ -n "${{ secrets.VIRELLO_KEYSTORE_PASSWORD }}" ] || MISSING="$MISSING VIRELLO_KEYSTORE_PASSWORD"
          [ -n "${{ secrets.VIRELLO_KEY_ALIAS }}" ] || MISSING="$MISSING VIRELLO_KEY_ALIAS"
          [ -n "${{ secrets.VIRELLO_KEY_PASSWORD }}" ] || MISSING="$MISSING VIRELLO_KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::warning::Secrets not visible to workflow:$MISSING — APK builds normally; AAB will be skipped until secrets are added."
            echo "KEYSTORE_OK=false" >> "$GITHUB_ENV"
          else
            echo "${{ secrets.VIRELLO_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
            cat > key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.VIRELLO_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.VIRELLO_KEY_ALIAS }}
          keyPassword=${{ secrets.VIRELLO_KEY_PASSWORD }}
          EOF
            echo "KEYSTORE_OK=true" >> "$GITHUB_ENV"
            echo "Release keystore configured."
          fi

      - name: Build APK (release, play flavor — OPPO test build)
        working-directory: apps/mobile
        # Production build: connect to Railway backend.
        # --flavor play selects Google Play Billing on the Dart side.
        run: flutter build apk --release --flavor play --dart-define=VIRELLO_STORE=play --dart-define=VIRELLO_API_URL=https://virello-api.vercel.app/api/v1

      - name: Verify release signature (never ship debug-signed)
        working-directory: apps/mobile
        run: |
          # 2026-10-06: CI silently shipped debug-signed APKs for weeks because the
          # release-keystore secrets were missing (each build got a fresh ephemeral
          # debug key -> Uptodown signature-mismatch ban). Fail loudly instead.
          APKSIGNER=$(find "${ANDROID_HOME:-$HOME/Android/Sdk}" -name apksigner -type f 2>/dev/null | head -1)
          if [ -z "$APKSIGNER" ]; then echo "::error::apksigner not found"; exit 1; fi
          for apk in build/app/outputs/flutter-apk/app-play-release.apk; do
            DN=$("$APKSIGNER" verify --print-certs "$apk" | grep "certificate DN" | head -1)
            echo "$apk -> $DN"
            if echo "$DN" | grep -qi "CN=Android Debug"; then
              echo "::error::$apk is signed with the DEBUG key — VIRELLO_KEYSTORE_* secrets missing/misconfigured. Refusing to publish."
              exit 1
            fi
          done
          echo "Release signature OK."

      - name: Build AAB (release, Play Store)
        if: env.KEYSTORE_OK == 'true'
        working-directory: apps/mobile
        # Signed with the release keystore (upload key for Play App Signing).
        # --flavor play selects Google Play Billing on the Dart side.
        run: flutter build appbundle --release --flavor play --dart-define=VIRELLO_STORE=play --dart-define=VIRELLO_API_URL=https://virello-api.vercel.app/api/v1

      - name: Publish to GitHub Release (latest)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: apps/mobile
        run: |
          # Hafiz downloads APKs from the Releases page (no token needed in browser).
          # Recreate the 'latest' tag each build so it always points at the newest APKs.
          # (upload-artifact steps were removed 2026-10-06: the Actions artifact
          # storage quota is exhausted; the Release carries the same files and the
          # AAB rides along here too when it was built.)
          ASSETS=(
            build/app/outputs/flutter-apk/app-play-release.apk#virello-play.apk
          )
          AAB=build/app/outputs/bundle/playRelease/app-play-release.aab
          if [ -f "$AAB" ]; then ASSETS+=("$AAB#virello-play.aab"); fi
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          gh release create latest \
            --title "Latest Virello APKs" \
            --notes "Play flavor, built from main $(git rev-parse --short HEAD) on $(date -u +%Y-%m-%d)." \
            "${ASSETS[@]}"

      - name: AAB skipped (no keystore secrets)
        if: env.KEYSTORE_OK != 'true'
        run: |
          echo "::warning::AAB skipped. To enable signed AAB builds, add these 4 secrets in GitHub repo Settings > Secrets and variables > Actions:"
          echo "::warning::VIRELLO_KEYSTORE_BASE64, VIRELLO_KEYSTORE_PASSWORD, VIRELLO_KEY_ALIAS, VIRELLO_KEY_PASSWORD"
